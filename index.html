<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium SaaS Book Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        /* 3D Book Layout Styles */
        .book-container {
            perspective: 1500px;
        }
        .book {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }
        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.2, 0.6, 0.3, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }
        /* Smart Dark Mode Filter for PDF Canvases */
        .dark-mode-canvas canvas {
            filter: invert(0.9) hue-rotate(180deg);
        }
        /* Custom scrollbar for premium feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col transition-colors duration-300">

    <header class="w-full bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 px-6 py-4 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
            </div>
            <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent">LuminaRead <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-100 dark:bg-indigo-950 text-indigo-600 rounded-full">PRO</span></span>
        </div>

        <div class="flex items-center space-x-4">
            <label class="cursor-pointer bg-zinc-900 dark:bg-zinc-100 hover:bg-zinc-800 dark:hover:bg-zinc-200 text-white dark:text-zinc-900 px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-sm">
                Upload PDF
                <input type="file" id="pdf-input" accept=".pdf" class="hidden">
            </label>
            
            <button id="theme-toggle" class="p-2 rounded-lg bg-zinc-200 dark:bg-zinc-800 hover:ring-2 hover:ring-zinc-400 dark:hover:ring-zinc-600 transition-all">
                <svg id="sun-icon" class="h-5 w-5 hidden dark:block text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 14.121a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zm2.121-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z"/></svg>
                <svg id="moon-icon" class="h-5 w-5 dark:hidden text-zinc-700" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 relative overflow-hidden">
        
        <div id="welcome-screen" class="text-center max-w-md mx-auto">
            <div class="mb-6 inline-flex p-4 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            </div>
            <h2 class="text-2xl font-bold mb-2">Welcome to your Premium Reader</h2>
            <p class="text-zinc-500 dark:text-zinc-400 mb-6 text-sm">Upload a PDF digital book to experience beautiful, seamless skeuomorphic reading with intelligent dark mode filtering.</p>
        </div>

        <div id="reader-view" class="w-full max-w-5xl flex flex-col items-center hidden">
            <div class="book-container w-full aspect-[4/3] max-h-[70vh] flex items-center justify-center bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl p-8 border border-zinc-200/50 dark:border-zinc-800/50 relative">
                
                <div class="absolute left-1/2 top-0 bottom-0 w-8 -ml-4 bg-gradient-to-r from-black/5 via-black/10 to-black/5 z-20 pointer-events-none"></div>

                <div id="book-viewport" class="w-full h-full flex relative rounded shadow-lg overflow-hidden">
                    <div id="left-page-container" class="w-1/2 h-full bg-zinc-50 border-r border-zinc-200 overflow-hidden flex items-center justify-center">
                        <div id="left-page" class="w-full h-full flex items-center justify-center"></div>
                    </div>
                    <div id="right-page-container" class="w-1/2 h-full bg-zinc-50 overflow-hidden flex items-center justify-center">
                        <div id="right-page" class="w-full h-full flex items-center justify-center"></div>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex items-center space-x-6 bg-white dark:bg-zinc-900 px-6 py-3 rounded-full shadow-md border border-zinc-200 dark:border-zinc-800">
                <button id="prev-btn" class="p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 disabled:opacity-30 transition-colors" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                </button>
                
                <span class="text-sm font-medium tracking-wide">
                    Page <span id="page-num" class="text-indigo-600 font-bold">1</span> of <span id="page-count" class="font-bold">1</span>
                </span>

                <button id="next-btn" class="p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 disabled:opacity-30 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        // Set up Mozilla's PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPageNum = 1;
        const scale = 1.5; // Adjust rendering sharpness scale

        // UI Selectors
        const pdfInput = document.getElementById('pdf-input');
        const welcomeScreen = document.getElementById('welcome-screen');
        const readerView = document.getElementById('reader-view');
        const leftPageEl = document.getElementById('left-page');
        const rightPageEl = document.getElementById('right-page');
        const pageNumDisplay = document.getElementById('page-num');
        const pageCountDisplay = document.getElementById('page-count');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const bookViewport = document.getElementById('book-viewport');

        // Dark Mode State & Logic
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            bookViewport.classList.add('dark-mode-canvas');
        } else {
            document.documentElement.classList.remove('dark');
            bookViewport.classList.remove('dark-mode-canvas');
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                bookViewport.classList.remove('dark-mode-canvas');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                bookViewport.classList.add('dark-mode-canvas');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Listen for PDF file uploads
        pdfInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === "application/pdf") {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const typedarray = new Uint8Array(evt.target.result);
                    loadPDF(typedarray);
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Initialize PDF Document loading
        async function loadPDF(pdfData) {
            try {
                pdfDoc = await pdfjsLib.getDocument({ data: pdfData }).promise;
                pageCountDisplay.textContent = pdfDoc.numPages;
                
                // Swap views from welcome screen to the interactive book
                welcomeScreen.classList.add('hidden');
                readerView.classList.remove('hidden');
                
                currentPageNum = 1;
                renderBookSpread();
            } catch (error) {
                alert("Error loading PDF: " + error.message);
            }
        }

        // Render the double-page spread with page-flip animation
        async function renderBookSpread() {
            // Update Page indicator UI
            pageNumDisplay.textContent = currentPageNum === 1 ? "1" : `${currentPageNum}-${Math.min(currentPageNum + 1, pdfDoc.numPages)}`;
            prevBtn.disabled = currentPageNum <= 1;
            nextBtn.disabled = currentPageNum + 1 >= pdfDoc.numPages;

            // Trigger structural simulated CSS flip animation
            bookViewport.style.transform = 'scale(0.98)';
            bookViewport.style.opacity = '0.7';

            setTimeout(async () => {
                // Clear out previous pages
                leftPageEl.innerHTML = '';
                rightPageEl.innerHTML = '';

                // Render Left Page
                if (currentPageNum <= pdfDoc.numPages) {
                    const canvasLeft = await renderPageToCanvas(currentPageNum);
                    leftPageEl.appendChild(canvasLeft);
                }

                // Render Right Page (If it exists)
                if (currentPageNum + 1 <= pdfDoc.numPages) {
                    const canvasRight = await renderPageToCanvas(currentPageNum + 1);
                    rightPageEl.appendChild(canvasRight);
                } else {
                    // Blank page styling if the book ends on an odd page
                    rightPageEl.innerHTML = '<div class="w-full h-full bg-zinc-50 dark:bg-zinc-900"></div>';
                }

                // Bring back animation state smoothly
                bookViewport.style.transform = 'scale(1)';
                bookViewport.style.opacity = '1';
            }, 150);
        }

        // Helper function: Convert PDF index page into HTML5 Canvas element
        async function renderPageToCanvas(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: scale });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.objectFit = 'contain';

            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };
            
            await page.render(renderContext).promise;
            return canvas;
        }

        // Pagination Click Events
        prevBtn.addEventListener('click', () => {
            if (currentPageNum > 1) {
                currentPageNum = currentPageNum === 2 ? 1 : currentPageNum - 2;
                renderBookSpread();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPageNum + 1 < pdfDoc.numPages) {
                currentPageNum = currentPageNum === 1 ? 2 : currentPageNum + 2;
                renderBookSpread();
            }
        });

        // Keyboard Arrow Shortcuts for accessibility
        window.addEventListener('keydown', (e) => {
            if (pdfDoc) {
                if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
                if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
            }
        });
    </script>
</body>
</html>
