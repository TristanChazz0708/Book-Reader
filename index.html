<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acrobat Pro + Real Book Flip Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf_viewer.min.css">
    
    <style>
        .book-container {
            perspective: 2000px;
        }
        .book-viewport {
            transition: transform 0.4s cubic-bezier(0.2, 0.6, 0.3, 1), opacity 0.3s ease;
            transform-style: preserve-3d;
        }
        /* Smart Dark Mode Filter for PDF Canvases & Text */
        .dark-mode-canvas canvas {
            filter: invert(0.92) hue-rotate(180deg);
        }
        .dark-mode-canvas .textLayer {
            mix-blend-mode: difference;
        }
        /* Relative position required for accurate text layer alignment over canvas */
        .page-wrapper {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        /* Custom adjustment to make Acrobat selection style play nice with 3D wrapper scales */
        .textLayer {
            opacity: 0.25;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col transition-colors duration-300 select-text">

    <header class="w-full bg-white dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800 px-4 py-2 flex justify-between items-center shadow-sm z-30 select-none">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <div class="bg-red-600 p-1.5 rounded text-white font-black text-xs tracking-wider">PDF</div>
                <span class="font-bold text-md hidden md:inline">Acrobat<span class="text-indigo-500 font-medium">Flip</span> Studio</span>
            </div>
            
            <label class="cursor-pointer bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-xs font-medium px-3 py-1.5 rounded transition-all">
                Open File...
                <input type="file" id="pdf-input" accept=".pdf" class="hidden">
            </label>
        </div>

        <div id="toolbar-controls" class="hidden flex items-center space-x-4 md:space-x-6">
            <div class="flex items-center space-x-1.5 text-xs">
                <button id="prev-btn" class="p-1.5 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <input type="number" id="page-jump-input" class="w-12 text-center bg-zinc-50 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded py-0.5 font-semibold" value="1" min="1">
                <span class="text-zinc-400">/</span>
                <span id="page-count-total" class="font-medium">1</span>
                <button id="next-btn" class="p-1.5 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>

            <div class="h-4 w-px bg-zinc-300 dark:bg-zinc-700"></div>

            <div class="flex items-center space-x-2 text-xs">
                <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"/></svg>
                <input type="range" id="zoom-slider" min="0.5" max="2.0" step="0.1" value="1.0" class="w-20 md:w-32 accent-indigo-600 bg-zinc-200 dark:bg-zinc-700 h-1 rounded-lg appearance-none cursor-pointer">
                <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>
                <span id="zoom-percent" class="w-10 text-right font-mono text-zinc-500">100%</span>
            </div>
        </div>

        <div class="flex items-center space-x-2 select-none">
            <div id="highlight-pill" class="hidden text-xs bg-amber-100 dark:bg-amber-950/50 text-amber-700 dark:text-amber-400 font-medium px-2.5 py-1 rounded-full items-center space-x-1">
                <span class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></span>
                <span>Text Select Active</span>
            </div>

            <button id="fullscreen-btn" class="p-1.5 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400" title="Toggle Fullscreen">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4h4m12 4V4h-4M4 16v4h4m12-4v4h-4"/></svg>
            </button>
            <button id="theme-toggle" class="p-1.5 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400">
                <svg id="sun-icon" class="h-5 w-5 hidden dark:block text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 14.121a1 1 0 011.414 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zm2.121-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z"/></svg>
                <svg id="moon-icon" class="h-5 w-5 dark:hidden text-zinc-700" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
            </button>
        </div>
    </header>

    <main id="studio-root" class="flex-1 flex items-center justify-center p-4 relative overflow-hidden bg-zinc-200 dark:bg-zinc-900 transition-all duration-300">
        
        <div id="welcome-screen" class="text-center max-w-sm mx-auto select-none">
            <h2 class="text-xl font-bold mb-2">Acrobat Skeuomorphic Reader</h2>
            <p class="text-zinc-500 dark:text-zinc-400 mb-4 text-xs">Drop or load your book file to interact with a real double-page presentation featuring selectable, standard searchable text elements.</p>
        </div>

        <div id="reader-view" class="w-full h-full flex items-center justify-center hidden book-container">
            <div id="book-viewport" class="book-viewport flex bg-white dark:bg-zinc-950 rounded shadow-2xl overflow-hidden relative max-w-full">
                
                <div class="absolute left-1/2 top-0 bottom-0 w-6 -ml-3 bg-gradient-to-r from-black/5 via-black/15 to-black/5 z-20 pointer-events-none"></div>

                <div class="w-1/2 bg-white dark:bg-zinc-900 border-r border-zinc-200 dark:border-zinc-800 overflow-hidden page-wrapper flex justify-center items-center">
                    <div id="left-page" class="w-full h-full flex items-center justify-center relative"></div>
                </div>

                <div class="w-1/2 bg-white dark:bg-zinc-900 overflow-hidden page-wrapper flex justify-center items-center">
                    <div id="right-page" class="w-full h-full flex items-center justify-center relative"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let pdfDoc = null;
        let currentPageNum = 1;
        let currentZoomScale = 1.0; 
        const baseRenderDPI = 1.5; // High rendering output base resolution

        // DOM Element Mapping
        const pdfInput = document.getElementById('pdf-input');
        const welcomeScreen = document.getElementById('welcome-screen');
        const readerView = document.getElementById('reader-view');
        const toolbarControls = document.getElementById('toolbar-controls');
        const leftPageEl = document.getElementById('left-page');
        const rightPageEl = document.getElementById('right-page');
        const pageJumpInput = document.getElementById('page-jump-input');
        const pageCountTotal = document.getElementById('page-count-total');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomPercent = document.getElementById('zoom-percent');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const bookViewport = document.getElementById('book-viewport');
        const studioRoot = document.getElementById('studio-root');
        const highlightPill = document.getElementById('highlight-pill');

        // Dark/Light Theme Switching Configurations
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            bookViewport.classList.add('dark-mode-canvas');
        }
        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                bookViewport.classList.remove('dark-mode-canvas');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                bookViewport.classList.add('dark-mode-canvas');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Fullscreen API Handling Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                studioRoot.requestFullscreen().catch(err => alert(`Fullscreen error: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        });

        // Capture PDF input pipeline loading
        pdfInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === "application/pdf") {
                const reader = new FileReader();
                reader.onload = (evt) => loadPDF(new Uint8Array(evt.target.result));
                reader.readAsArrayBuffer(file);
            }
        });

        async function loadPDF(pdfData) {
            try {
                pdfDoc = await pdfjsLib.getDocument({ data: pdfData }).promise;
                pageCountTotal.textContent = pdfDoc.numPages;
                pageJumpInput.max = pdfDoc.numPages;
                
                welcomeScreen.classList.add('hidden');
                readerView.classList.remove('hidden');
                toolbarControls.classList.remove('flex', 'hidden');
                toolbarControls.classList.add('flex');
                highlightPill.classList.remove('hidden');
                highlightPill.classList.add('inline-flex');
                
                currentPageNum = 1;
                renderBookSpread();
            } catch (error) {
                alert("Error structural PDF engine init processing: " + error.message);
            }
        }

        // Main Render Cycle Engine
        async function renderBookSpread() {
            pageJumpInput.value = currentPageNum;
            prevBtn.disabled = currentPageNum <= 1;
            nextBtn.disabled = currentPageNum + 1 >= pdfDoc.numPages;

            // Page Turning Animation (Skeuomorphic simulated flip duration)
            bookViewport.style.transform = 'rotateY(-8deg) scale(0.97)';
            bookViewport.style.opacity = '0.65';

            setTimeout(async () => {
                leftPageEl.innerHTML = '';
                rightPageEl.innerHTML = '';

                // Left Render Stack Execution
                if (currentPageNum <= pdfDoc.numPages) {
                    const pageContainer = await createPdfPageStack(currentPageNum);
                    leftPageEl.appendChild(pageContainer);
                }

                // Right Render Stack Execution
                if (currentPageNum + 1 <= pdfDoc.numPages) {
                    const pageContainer = await createPdfPageStack(currentPageNum + 1);
                    rightPageEl.appendChild(pageContainer);
                } else {
                    rightPageEl.innerHTML = '<div class="w-full h-full bg-zinc-50 dark:bg-zinc-900"></div>';
                }

                // Restore View Matrix cleanly after asset creation loads
                bookViewport.style.transform = `rotateY(0deg) scale(${currentZoomScale})`;
                bookViewport.style.opacity = '1';
            }, 180);
        }

        // Generates the combined Canvas Layer + Native Adobe Highlight Text Layer
        async function createPdfPageStack(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: baseRenderDPI });

            // Create structural alignment layer container
            const container = document.createElement('div');
            container.className = 'relative w-full h-full overflow-hidden flex items-center justify-center';
            container.style.width = `${viewport.width / baseRenderDPI}px`;
            container.style.height = `${viewport.height / baseRenderDPI}px`;

            // 1. Generate Graphic Canvas Layer
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            canvas.className = 'absolute top-0 left-0 w-full h-full pointer-events-none';
            container.appendChild(canvas);

            // 2. Generate Adobe-Style Selectable Text Highlight Overlay Layer
            const textLayerDiv = document.createElement('div');
            textLayerDiv.className = 'textLayer absolute top-0 left-0 w-full h-full';
            container.appendChild(textLayerDiv);

            // Render Graphic Elements to Canvas
            const renderContext = { canvasContext: context, viewport: viewport };
            await page.render(renderContext).promise;

            // Render Text Glyphs precisely over pixels
            const textContent = await page.getTextContent();
            pdfjsLib.renderTextLayer({
                textContent: textContent,
                container: textLayerDiv,
                viewport: viewport,
                textDivs: []
            });

            return container;
        }

        // Dynamic Interactive Controls Events Handling Pipeline
        zoomSlider.addEventListener('input', (e) => {
            currentZoomScale = parseFloat(e.target.value);
            zoomPercent.textContent = `${Math.round(currentZoomScale * 100)}%`;
            bookViewport.style.transform = `scale(${currentZoomScale})`;
        });

        pageJumpInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > pdfDoc.numPages) val = pdfDoc.numPages;
            
            // Adjust calculation window parameters targeting matching double splits
            currentPageNum = val % 2 === 0 ? val : val;
            renderBookSpread();
        });

        prevBtn.addEventListener('click', () => {
            if (currentPageNum > 1) {
                currentPageNum = currentPageNum === 2 ? 1 : currentPageNum - 2;
                renderBookSpread();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPageNum + 1 < pdfDoc.numPages) {
                currentPageNum = currentPageNum === 1 ? 2 : currentPageNum + 2;
                renderBookSpread();
            }
        });

        // Basic Hotkey Event Adapters
        window.addEventListener('keydown', (e) => {
            if (pdfDoc) {
                if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
                if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
            }
        });
    </script>
</body>
</html>
