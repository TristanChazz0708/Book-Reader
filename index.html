<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaReader | Premium Web Reader</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        /* Custom Premium Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            overflow: hidden; /* Prevent body scrolling, keep it app-like */
        }

        /* Ruler Assist Styles */
        #ruler-guide {
            display: none;
            position: fixed;
            left: 0;
            width: 100vw;
            height: 4px;
            background-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            pointer-events: none; /* Let clicks pass through to the book */
            z-index: 50;
        }

        /* 3D Book Container Base */
        #book-container {
            width: 100%;
            height: calc(100vh - 64px); /* Subtract header height */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px; /* Essential for 3D page flip */
        }

        /* Styles for the pages generated by app.js */
        .page {
            background-color: #ffffff;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.1); /* Inner spine shadow */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tool-btn {
            transition: all 0.2s ease;
        }
        .tool-btn.active {
            color: #38bdf8;
            background-color: #1e293b;
            border-radius: 0.375rem;
        }
    </style>
</head>
<body class="flex flex-col h-screen font-sans antialiased">

    <div id="ruler-guide"></div>

    <header class="bg-slate-800 shadow-md h-16 flex items-center justify-between px-6 shrink-0 z-40 border-b border-slate-700">
        
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-blue-600">
                <i class="fa-solid fa-book-open mr-2 text-sky-400"></i>NovaReader
            </h1>
            <div class="h-6 w-px bg-slate-600 mx-2"></div>
            <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded shadow transition text-sm font-medium">
                <i class="fa-solid fa-file-arrow-up mr-2"></i> Open Book
                <input type="file" id="file-upload" accept=".pdf, .epub" class="hidden" />
            </label>
        </div>

        <div class="flex items-center space-x-2 bg-slate-900 rounded-lg p-1 border border-slate-700" id="tool-group">
            <button class="tool-btn active w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white" title="Select / Pan" data-tool="select">
                <i class="fa-solid fa-arrow-pointer"></i>
            </button>
            <button class="tool-btn w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white" title="Highlight" data-tool="highlight">
                <i class="fa-solid fa-highlighter"></i>
            </button>
            <button class="tool-btn w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white" title="Pen Tool" data-tool="pen">
                <i class="fa-solid fa-pen"></i>
            </button>
            <button class="tool-btn w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white" title="Eraser" data-tool="eraser">
                <i class="fa-solid fa-eraser"></i>
            </button>
            <button class="tool-btn w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white" title="Add Comment" data-tool="comment">
                <i class="fa-solid fa-comment-medical"></i>
            </button>
            <div class="h-6 w-px bg-slate-700 mx-1"></div>
            <button class="tool-btn w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white" title="Ruler Assist" id="toggle-ruler">
                <i class="fa-solid fa-ruler-horizontal"></i>
            </button>
            <button class="tool-btn w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white" title="Add Bookmark" id="add-bookmark">
                <i class="fa-solid fa-bookmark"></i>
            </button>
        </div>

        <div class="flex items-center space-x-4 text-slate-300">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-magnifying-glass-minus text-xs cursor-pointer hover:text-white" id="zoom-out"></i>
                <input type="range" min="50" max="200" value="100" class="w-24 accent-sky-500 cursor-pointer" id="zoom-slider">
                <i class="fa-solid fa-magnifying-glass-plus text-xs cursor-pointer hover:text-white" id="zoom-in"></i>
                <span class="text-xs font-mono w-8 text-right" id="zoom-label">100%</span>
            </div>
            <button id="fullscreen-btn" class="text-slate-400 hover:text-white transition" title="Full Screen">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 relative flex">
        
        <aside class="w-64 bg-slate-800/50 border-r border-slate-700 hidden md:flex flex-col">
            <div class="p-4 border-b border-slate-700">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Contents & Bookmarks</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2 text-sm text-slate-300" id="sidebar-content">
                <div class="p-2 hover:bg-slate-700 rounded cursor-pointer transition flex items-center">
                    <i class="fa-regular fa-file-lines w-5 text-slate-500"></i> Cover
                </div>
                <p class="text-xs text-slate-500 italic mt-4 text-center">Open a document to see contents.</p>
            </div>
        </aside>

        <div id="book-container" class="flex-1 overflow-auto bg-slate-900 relative">
            
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-500">
                <i class="fa-solid fa-book-open-reader text-6xl mb-4 opacity-50"></i>
                <h2 class="text-2xl font-medium text-slate-300 mb-2">Ready to Read</h2>
                <p class="max-w-md text-center text-sm">Upload a PDF to begin. Your reading progress, annotations, and bookmarks will be saved securely offline.</p>
            </div>

            <div id="flipbook" class="hidden shadow-2xl transition-transform duration-300">
                </div>
            
        </div>
    </main>

    <script>
        // 1. Tool Selection UI Logic
        const toolBtns = document.querySelectorAll('#tool-group .tool-btn[data-tool]');
        let currentTool = 'select'; // Default tool

        toolBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
                console.log('Active Tool:', currentTool);
                // Note: The actual drawing logic for these tools will need to be hooked 
                // up to Fabric.js in your app.js file in future updates.
            });
        });

        // 2. Fullscreen Auto-sizing Logic
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Toggle Fullscreen icon state automatically
        document.addEventListener('fullscreenchange', () => {
            const icon = fullscreenBtn.querySelector('i');
            if (document.fullscreenElement) {
                icon.classList.replace('fa-expand', 'fa-compress');
            } else {
                icon.classList.replace('fa-compress', 'fa-expand');
            }
        });

        // 3. Ruler Assist Logic
        const rulerBtn = document.getElementById('toggle-ruler');
        const rulerGuide = document.getElementById('ruler-guide');
        let rulerActive = false;

        rulerBtn.addEventListener('click', () => {
            rulerActive = !rulerActive;
            rulerBtn.classList.toggle('active');
            rulerGuide.style.display = rulerActive ? 'block' : 'none';
        });

        // Make ruler follow mouse vertically
        document.addEventListener('mousemove', (e) => {
            if (rulerActive) {
                rulerGuide.style.top = `${e.clientY}px`;
            }
        });

        // 4. Zoom Slider Logic
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomLabel = document.getElementById('zoom-label');
        const flipbook = document.getElementById('flipbook');

        zoomSlider.addEventListener('input', (e) => {
            const zoomVal = e.target.value;
            zoomLabel.textContent = `${zoomVal}%`;
            // Applies CSS scaling to the book container
            flipbook.style.transform = `scale(${zoomVal / 100})`;
        });

        // 5. Register the Offline Service Worker (sw.js)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registered successfully with scope:', registration.scope);
                }).catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>

    <script src="app.js"></script>
</body>
</html>
